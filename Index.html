
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SpendWise</title>

    <link rel="stylesheet" href="style.css">
</head>

<section class="expenses-section"></section>
    <h2>Add Expense</h2>

    <form id="expense-form">

        <label for="expense-name">Expense Name</label>
        <input
            type="text"
            id="expense-name"
            placeholder="e.g. Lunch"
            required
        >

        <label for="expense-amount">Amount</label>
        <input
            type="number"
            id="expense-amount"
            placeholder="e.g. 500"
            required
        >

        <label for="expense-category">Category</label>
        <select id="expense-category">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Rent">Rent</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
        </select>

        <button type="submit">Add Expense</button>

    </form>

</section>
<section class="budget-summary">

    <h2>Budget Summary</h2>

    <p>Budget: KES <span id="budget-display">0</span></p>

    <p>Total Expenses: KES
        <span id="total-expenses">0</span>
    </p>

    <p>Remaining Balance: KES
        <span id="remaining-balance">0</span>
    </p>

    <p id="budget-status">Enter your expenses to see your budget status.</p>

</section>
<section class="expense-list-section">

    <h2>Expense Records</h2>

    <ul id="expense-list"></ul>
   
    </section>

</body>
<script src="script.js"></script>
</body>
</html>
